<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDR Shopify Toolkit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">HDR WORKSPACE</span>
        <h1>Shopify Toolkit</h1>
        <p id="count">Scanning page...</p>
      </div>
      <button
        id="refresh"
        class="refresh-button"
        title="Scan page again"
        aria-label="Scan page again"
      >
        &#8635;
      </button>
    </header>

    <nav class="tabs" aria-label="Toolkit sections">
      <button
        class="tab-button active"
        type="button"
        data-tab="images"
        aria-selected="true"
      >
        Image studio
      </button>
      <button
        id="openInventoryDashboard"
        class="tab-button"
        type="button"
        aria-selected="false"
      >
        Inventory dashboard
      </button>
    </nav>

    <section
      id="imageWorkspace"
      class="tab-panel active"
      aria-label="Image studio"
    >
      <section class="settings">
        <div class="section-label">Canvas settings</div>
        <label>
          Canvas size
          <select id="canvasSize">
            <option value="1000">1000 &times; 1000 px</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="keepAspect" checked />
          <span>Keep image aspect ratio</span>
        </label>
      </section>

      <div class="toolbar">
        <button id="selectAll">Select all</button>
        <button id="clearAll">Clear</button>
        <button id="downloadSelected" class="primary">Download</button>
        <button id="uploadShopify" class="secondary-action">
          Upload to Shopify
        </button>
      </div>

      <div class="popup-inventory-link-row">
        <button
          id="openInventoryDashboardPage"
          class="inventory-dashboard-button"
          type="button"
        >
          Open inventory dashboard
        </button>
      </div>

      <main id="imageList"></main>
    </section>

    <footer><span id="status">Ready</span></footer>
    <script src="popup.js"></script>
  </body>
</html>
